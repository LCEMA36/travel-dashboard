name: Update live flight status

on:
  schedule:
    # Every 30 minutes. GitHub may delay this a few minutes under load.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch live flight status
        env:
          AVIATIONSTACK_KEY: ${{ secrets.AVIATIONSTACK_KEY }}
        run: |
          # Works whether the repo uses scripts/ or has everything at the root.
          SCRIPT=$(ls scripts/flight_status.py flight_status.py 2>/dev/null | head -1)
          if [ -z "$SCRIPT" ]; then echo "flight_status.py not found"; exit 1; fi
          echo "Running $SCRIPT"
          python3 "$SCRIPT"

      - name: Commit if changed
        run: |
          git config user.name "travel-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- data/live-status.json live-status.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No change in live status."
          else
            git commit -m "Update live flight status"
            git push
          fi
