name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
  # A commit pushed by a workflow's own GITHUB_TOKEN does NOT trigger other
  # workflows, so the sync jobs' commits would never redeploy the site and it
  # would serve stale trips. Redeploy whenever a sync finishes.
  workflow_run:
    workflows: ["Sync trips from TripIt calendar feed", "Update live flight status"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
